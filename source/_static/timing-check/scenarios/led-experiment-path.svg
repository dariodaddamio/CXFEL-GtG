<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 265" role="img" aria-labelledby="led-path-title led-path-desc">
<title id="led-path-title">LED detection and the two test events</title>
<desc id="led-path-desc">CAM2 observes the LED. Software detects a dark-to-bright change and triggers the generator. Event 42 is the first test event; event 43 follows after the selected interval. Two receivers log both timestamps. The interval does not measure LED-to-event latency.</desc>
<defs><marker id="led-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#35618a" stroke-width="1.5"/></marker></defs>
<rect width="1100" height="265" fill="white"/>
<g font-family="Arial,sans-serif" fill="#182838">
<g fill="#f5f7f9" stroke="#bdc9d3"><rect x="20" y="28" width="190" height="90" rx="4"/><rect x="250" y="28" width="220" height="90" rx="4"/><rect x="510" y="28" width="230" height="90" rx="4"/><rect x="800" y="28" width="280" height="90" rx="4"/></g>
<g font-size="16" font-weight="600"><text x="36" y="54">CAM2 observes LED</text><text x="266" y="54">Software detects LED</text><text x="526" y="54">Generator: 42 → 43</text><text x="816" y="54">Receivers log both events</text></g>
<g font-size="14" fill="#455a6a"><text x="36" y="80">192.168.2.1</text><text x="36" y="102">DG645 drives the LED</text><text x="266" y="80">10.139.4.59</text><text x="266" y="102">Fresh dark → bright image</text><text x="526" y="80">10.139.5.196</text><text x="526" y="102">Software-triggered sequence</text><text x="816" y="80">10.139.5.195</text><text x="816" y="102">10.139.5.198</text></g>
<g fill="none" stroke="#35618a" stroke-width="1.7" marker-end="url(#led-arrow)"><path d="M210 74H246"/><path d="M470 74H506"/><path d="M740 74H796"/></g>
<path d="M20 145H1080" stroke="#d3dbe2"/>
<text x="20" y="178" font-size="15" font-weight="600">Measured at each receiver</text>
<text x="20" y="204" font-size="14" fill="#455a6a">Timestamp 43 − timestamp 42</text>
<path d="M390 196H1060" stroke="#35618a" stroke-width="1.7"/>
<path d="M450 181V211M990 181V211" stroke="#182838" stroke-width="2"/>
<text x="450" y="171" font-size="14" text-anchor="middle">42 · first event</text><text x="990" y="171" font-size="14" text-anchor="middle">43 · follow-up event</text>
<path d="M450 221V228H990V221" stroke="#35618a" stroke-width="1.4" fill="none"/>
<text x="720" y="251" font-size="15" text-anchor="middle" font-weight="600">8 ns selected interval · diagram not to scale</text>
</g></svg>
