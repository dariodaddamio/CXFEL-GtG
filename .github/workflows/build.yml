name: Build Sphinx docs

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - Main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import furo; print('furo OK:', furo.__file__)"

      - name: Build HTML
        # -E fresh environment, -a write all HTML (Furo embeds nav; avoids stale sidebar URLs)
        run: sphinx-build -W -E -a source build/html
