name: Build and deploy Sphinx docs to GitHub Pages

on:
  push:
    branches: [Main, main]
    # Match GitHub default branch casing (main vs Main)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          # Pin: an unbounded 3.x can resolve to very new Python (e.g. 3.14) before
          # all wheels/themes are ready; Furo must import cleanly for sphinx-build.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import furo; print('furo OK:', furo.__file__)"

      - name: Build Sphinx HTML
        run: |
          sphinx-build -W source build/html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
